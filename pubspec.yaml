name: qr_code_app
description: "プリQR - QRコードを生成・読み取り・管理するクロスプラットフォームアプリ。"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  auto_route: ^11.1.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  qr_shared:
    path: packages/qr_shared

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8

  # Image handling
  crop_your_image: ^2.0.0
  image: ^4.8.0
  image_picker: ^1.2.1

  # File handling
  file_picker: ^10.3.10
  desktop_drop: ^0.7.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  flutter_secure_storage: ^9.2.4
  http: ^1.4.0
  msal_auth: ^3.3.0
  web: ^1.1.1
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

  # Export/Import
  archive: ^4.0.9

  # Utilities
  uuid: ^4.5.3
  collection: ^1.19.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

  # Code generation
  build_runner: ^2.13.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  auto_route_generator: ^10.4.0
  drift_dev: ^2.31.0
  flutter_launcher_icons: ^0.14.4
  melos: ^7.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.jpg
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon.jpg
  web:
    generate: true
    image_path: assets/app_icon.jpg
  windows:
    generate: true
    image_path: assets/app_icon.jpg
    icon_size: 48
  macos:
    generate: true
    image_path: assets/app_icon.jpg

flutter:
  uses-material-design: true
  assets:
    - assets/msal_config.json

melos:
  packages:
    - .
    - packages/**
    - tools/**
  scripts:
    bootstrap:
      description: 依存関係をすべて取得する
      run: |
        flutter pub get
        (cd tools/db_editor && flutter pub get)
        (cd packages/qr_shared && dart pub get)
    pub:get:
      description: 依存関係を再取得する
      run: melos run bootstrap
    codegen:
      description: コード生成をまとめて実行する
      run: |
        flutter pub run build_runner build --delete-conflicting-outputs
        (cd packages/qr_shared && dart run build_runner build --delete-conflicting-outputs)
    icons:
      description: アプリアイコンを再生成する
      run: flutter pub run flutter_launcher_icons
